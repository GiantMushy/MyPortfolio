name: Build and Deploy ASP.NET Core to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and generate static site
        run: |
          # Build the application
          dotnet build --configuration Release --no-restore
          
          # Create output directory
          mkdir -p dist
          
          # Copy static assets from wwwroot first
          cp -R wwwroot/* dist/
          
          # Set environment variables for production
          export ASPNETCORE_ENVIRONMENT=Production
          export ASPNETCORE_URLS="http://localhost:5000"
          export ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Warning
          
          # Start the application in background
          echo "🚀 Starting ASP.NET Core application..."
          dotnet run --configuration Release --no-build --no-launch-profile > app.log 2>&1 &
          APP_PID=$!
          
          echo "📋 Application PID: $APP_PID"
          
          # Wait for app to start with better error handling
          echo "⏳ Waiting for application to start..."
          READY=false
          for i in {1..90}; do
            if curl -f -s http://localhost:5000/ > /dev/null 2>&1; then
              echo "✅ Application is ready on port 5000!"
              READY=true
              break
            fi
            echo "⏳ Attempt $i/90: Waiting for app..."
            
            # Check if process is still running
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "❌ Application process died. Checking logs:"
              cat app.log
              exit 1
            fi
            
            sleep 2
          done
          
          if [ "$READY" = false ]; then
            echo "❌ Application failed to start within 3 minutes. Checking logs:"
            cat app.log
            echo "🔍 Process status:"
            ps aux | grep dotnet || echo "No dotnet processes found"
            echo "🌐 Network status:"
            netstat -tlnp | grep 5000 || echo "Port 5000 not in use"
            exit 1
          fi
          
          # Test the application response
          echo "🧪 Testing application response..."
          RESPONSE=$(curl -s -w "HTTP_CODE:%{http_code}" http://localhost:5000/)
          echo "Response: $RESPONSE"
          
          # Generate static HTML files
          echo "🔄 Generating static pages..."
          
          # Generate home page (single-page app with all project views embedded)
          echo "📄 Generating home page..."
          if curl -f -s -o dist/index.html http://localhost:5000/; then
            echo "✅ Generated index.html ($(wc -c < dist/index.html) bytes)"
          else
            echo "❌ Failed to generate index.html from ASP.NET app"
            exit 1
          fi
          
          # Fix paths for GitHub Pages deployment
          # The ASP.NET app generates absolute paths like /css/site.css
          # GitHub Pages serves from /MyPortfolio/ subpath, so these break
          # Convert all absolute asset paths to relative (safe for root-level index.html)
          echo "🔧 Fixing asset paths for GitHub Pages..."
          find dist -name "*.html" -type f -exec sed -i 's|="/css/|="css/|g' {} \;
          find dist -name "*.html" -type f -exec sed -i 's|="/js/|="js/|g' {} \;
          find dist -name "*.html" -type f -exec sed -i 's|="/images/|="images/|g' {} \;
          find dist -name "*.html" -type f -exec sed -i 's|="/json/|="json/|g' {} \;
          find dist -name "*.html" -type f -exec sed -i 's|="/CV_|="CV_|g' {} \;
          echo "✅ Fixed asset paths to be relative"
          
          # Stop the application gracefully
          echo "🛑 Stopping application..."
          kill -TERM $APP_PID 2>/dev/null || true
          sleep 2
          kill -KILL $APP_PID 2>/dev/null || true
          
          # Include custom domain if present
          if [ -f CNAME ]; then 
            cp CNAME dist/
            echo "✅ Copied CNAME file"
          fi
          
          echo "📁 Final dist directory contents:"
          find dist -type f -exec ls -la {} \;
          
          echo "🔍 Checking generated HTML files:"
          for file in dist/*.html; do
            if [ -f "$file" ]; then
              echo "📄 $file ($(wc -c < "$file") bytes):"
              head -10 "$file"
              echo "..."
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
